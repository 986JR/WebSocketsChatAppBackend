<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WS Chat Tester</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --surface:   #13161e;
      --surface2:  #1c2030;
      --border:    #252a38;
      --accent:    #00e5a0;
      --accent2:   #0099ff;
      --danger:    #ff4d6a;
      --warn:      #ffb347;
      --text:      #e8eaf0;
      --muted:     #6b7280;
      --sent-bg:   #0e2a20;
      --recv-bg:   #1a1e2e;
      --join-bg:   #1a1228;
      --radius:    10px;
    }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }
    #status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: all 0.3s;
    }
    #status-badge .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }
    #status-badge.connected .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    #status-badge.connected { border-color: var(--accent); color: var(--accent); }
    #status-badge.error .dot { background: var(--danger); }
    #status-badge.error { border-color: var(--danger); color: var(--danger); }

    /* ── Main layout ── */
    .layout {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
    }

    /* ── Panel ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .panel-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-header .icon {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent2);
    }

    /* ── Left sidebar ── */
    .sidebar { display: flex; flex-direction: column; gap: 16px; }

    .field { display: flex; flex-direction: column; gap: 6px; padding: 0 18px; }
    .field:first-of-type { padding-top: 16px; }
    label {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    input[type="text"], input[type="password"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 13px;
      border-radius: var(--radius);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }
    input:focus { border-color: var(--accent2); }

    .btn {
      display: block;
      width: calc(100% - 36px);
      margin: 0 18px;
      padding: 11px;
      border: none;
      border-radius: var(--radius);
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }
    .btn-primary {
      background: var(--accent);
      color: #0a1a12;
    }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .btn-danger:hover { background: rgba(255,77,106,0.1); }
    .btn-danger:disabled { opacity: 0.3; cursor: not-allowed; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    /* Rooms list */
    .rooms {
      padding: 8px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .room-btn {
      padding: 9px 12px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      text-align: left;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .room-btn::before { content: '#'; color: var(--border); font-size: 14px; }
    .room-btn:hover { background: var(--surface2); color: var(--text); }
    .room-btn.active {
      background: rgba(0,229,160,0.08);
      border-color: rgba(0,229,160,0.25);
      color: var(--accent);
    }
    .room-btn.active::before { color: var(--accent); }

    .custom-room {
      padding: 0 10px 12px;
      display: flex;
      gap: 6px;
    }
    .custom-room input {
      flex: 1;
      padding: 8px 10px;
      font-size: 12px;
    }
    .custom-room button {
      padding: 8px 12px;
      background: var(--accent2);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .custom-room button:hover { opacity: 0.85; }

    /* ── Chat area ── */
    .chat-area { display: flex; flex-direction: column; gap: 16px; }

    /* Messages */
    #messages {
      height: 440px;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 3px;
      animation: fadeUp 0.2s ease;
      max-width: 75%;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.sent { align-self: flex-end; }
    .msg.recv { align-self: flex-start; }
    .msg.system { align-self: center; max-width: 90%; }

    .msg-meta {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      padding: 0 4px;
    }
    .msg.sent .msg-meta { text-align: right; }
    .msg.system .msg-meta { text-align: center; }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.55;
    }
    .msg.sent .msg-bubble {
      background: var(--sent-bg);
      border: 1px solid rgba(0,229,160,0.2);
      border-bottom-right-radius: 4px;
      color: #b8f5e0;
    }
    .msg.recv .msg-bubble {
      background: var(--recv-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.system .msg-bubble {
      background: var(--join-bg);
      border: 1px solid rgba(99,79,160,0.3);
      color: #a78bd4;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      text-align: center;
      padding: 7px 16px;
      border-radius: 99px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      gap: 10px;
    }
    .empty-state .big { font-size: 36px; }

    /* Input area */
    .input-area {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #msg-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: var(--radius);
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #msg-input:focus { border-color: var(--accent); }
    #msg-input:disabled { opacity: 0.4; cursor: not-allowed; }
    #send-btn {
      padding: 11px 20px;
      background: var(--accent);
      color: #0a1a12;
      border: none;
      border-radius: var(--radius);
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    #send-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    #send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 999;
    }
    #toast.show { opacity: 1; }
    #toast.success { background: var(--sent-bg); border: 1px solid var(--accent); color: var(--accent); }
    #toast.error   { background: #1a0d10; border: 1px solid var(--danger); color: var(--danger); }
    #toast.info    { background: var(--recv-bg); border: 1px solid var(--accent2); color: var(--accent2); }

    /* Room label */
    #room-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      padding: 0 4px;
    }

    @media (max-width: 650px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { order: 2; }
      .chat-area { order: 1; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">WS<span>Chat</span> <span style="color:var(--muted);font-size:13px;font-weight:400;">tester</span></div>
  <div id="status-badge">
    <span class="dot"></span>
    <span id="status-text">disconnected</span>
  </div>
</header>

<div class="layout">

  <!-- ── Sidebar ── -->
  <div class="sidebar">

    <!-- Connection -->
    <div class="panel">
      <div class="panel-header"><span class="icon"></span> Connection</div>
      <div style="padding: 14px 18px; display:flex; flex-direction:column; gap:12px;">
        <div class="field" style="padding:0">
          <label>Username</label>
          <input type="text" id="username" value="alice" placeholder="your username" />
        </div>
        <div class="field" style="padding:0">
          <label>Server URL</label>
          <input type="text" id="server-url" value="http://localhost:8080/ws-chat" />
        </div>
        <button class="btn btn-primary" id="connect-btn" style="width:100%;margin:0" onclick="connect()">Connect</button>
        <button class="btn btn-danger" id="disconnect-btn" style="width:100%;margin:0" onclick="disconnect()" disabled>Disconnect</button>
      </div>
    </div>

    <!-- Rooms -->
    <div class="panel">
      <div class="panel-header"><span class="icon" style="background:var(--accent2)"></span> Rooms</div>
      <div class="rooms" id="rooms-list">
        <button class="room-btn active" onclick="switchRoom('general')">general</button>
        <button class="room-btn" onclick="switchRoom('random')">random</button>
        <button class="room-btn" onclick="switchRoom('tech')">tech</button>
      </div>
      <div class="custom-room">
        <input type="text" id="custom-room-input" placeholder="custom room…" />
        <button onclick="addRoom()">Join</button>
      </div>
    </div>

    <!-- Quick actions -->
    <div class="panel">
      <div class="panel-header"><span class="icon" style="background:var(--warn)"></span> Quick Test</div>
      <div style="padding:12px 10px; display:flex; flex-direction:column; gap:6px;">
        <button class="room-btn" style="color:var(--text)" onclick="sendQuick('Hello everyone! 👋')">Send greeting</button>
        <button class="room-btn" style="color:var(--text)" onclick="sendJoin()">Send JOIN event</button>
        <button class="room-btn" style="color:var(--text)" onclick="clearMessages()">Clear messages</button>
        <button class="room-btn" style="color:var(--text)" onclick="loadHistory()">Load history (REST)</button>
      </div>
    </div>

  </div>

  <!-- ── Chat panel ── -->
  <div class="chat-area">
    <div class="panel" style="display:flex;flex-direction:column;flex:1;">
      <div class="panel-header" style="justify-content:space-between">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="icon" style="background:var(--accent)"></span>
          <span>Messages</span>
        </div>
        <span id="room-label"># general</span>
      </div>

      <div id="messages">
        <div class="empty-state" id="empty-state">
          <div class="big">💬</div>
          <div>Connect and join a room to start chatting</div>
        </div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="msg-input"
          placeholder="Type a message… (Enter to send)"
          disabled
          onkeydown="if(event.key==='Enter') sendMessage()"
        />
        <button id="send-btn" onclick="sendMessage()" disabled>Send →</button>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
  let stompClient = null;
  let currentRoom = 'general';
  let currentUser = 'alice';
  let currentSub = null;

  // ── Status helpers ──
  function setStatus(state, text) {
    const badge = document.getElementById('status-badge');
    const label = document.getElementById('status-text');
    badge.className = state;
    label.textContent = text;
  }

  function showToast(msg, type = 'info') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show ' + type;
    setTimeout(() => { t.className = ''; }, 3000);
  }

  // ── Connect / Disconnect ──
  function connect() {
    currentUser = document.getElementById('username').value.trim() || 'anonymous';
    const url = document.getElementById('server-url').value.trim();
    if (!url) return showToast('Enter server URL', 'error');

    setStatus('', 'connecting…');
    showToast('Connecting to ' + url, 'info');

    const socket = new SockJS(url);
    stompClient = Stomp.over(socket);
    stompClient.debug = null; // silence console spam

    stompClient.connect({}, function () {
      setStatus('connected', 'connected as ' + currentUser);
      showToast('Connected! ✓', 'success');

      document.getElementById('connect-btn').disabled = true;
      document.getElementById('disconnect-btn').disabled = false;
      document.getElementById('msg-input').disabled = false;
      document.getElementById('send-btn').disabled = false;

      subscribeToRoom(currentRoom);
      sendJoinEvent(currentRoom);
    }, function (err) {
      setStatus('error', 'connection failed');
      showToast('Failed to connect: ' + err, 'error');
    });
  }

  function disconnect() {
    if (stompClient) {
      stompClient.disconnect();
      stompClient = null;
    }
    setStatus('', 'disconnected');
    showToast('Disconnected', 'info');
    document.getElementById('connect-btn').disabled = false;
    document.getElementById('disconnect-btn').disabled = true;
    document.getElementById('msg-input').disabled = true;
    document.getElementById('send-btn').disabled = true;
    addSystemMessage('You disconnected');
  }

  // ── Rooms ──
  function subscribeToRoom(room) {
    if (currentSub) { currentSub.unsubscribe(); }
    currentSub = stompClient.subscribe('/topic/chat/' + room, function (msg) {
      const data = JSON.parse(msg.body);
      const isSelf = data.sender === currentUser;
      if (data.type === 'JOIN' || data.type === 'LEAVE') {
        addSystemMessage(data.content || data.sender + ' ' + data.type.toLowerCase() + 'ed');
      } else {
        addMessage(data.sender, data.content, isSelf);
      }
    });
  }

  function switchRoom(room) {
    if (room === currentRoom) return;
    currentRoom = room;
    document.getElementById('room-label').textContent = '# ' + room;
    clearMessages();

    // update active state
    document.querySelectorAll('.room-btn').forEach(b => {
      b.classList.toggle('active', b.textContent.trim() === room);
    });

    if (stompClient && stompClient.connected) {
      subscribeToRoom(room);
      sendJoinEvent(room);
      showToast('Joined #' + room, 'info');
    }
  }

  function addRoom() {
    const input = document.getElementById('custom-room-input');
    const name = input.value.trim().toLowerCase().replace(/\s+/g, '-');
    if (!name) return;
    const list = document.getElementById('rooms-list');
    // check not duplicate
    if ([...list.querySelectorAll('.room-btn')].some(b => b.textContent.trim() === name)) {
      switchRoom(name); input.value = ''; return;
    }
    const btn = document.createElement('button');
    btn.className = 'room-btn';
    btn.textContent = name;
    btn.onclick = () => switchRoom(name);
    list.appendChild(btn);
    input.value = '';
    switchRoom(name);
  }

  // ── Messaging ──
  function sendMessage() {
    if (!stompClient || !stompClient.connected) return showToast('Not connected', 'error');
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;

    stompClient.send('/app/chat.send/' + currentRoom, {}, JSON.stringify({
      sender: currentUser,
      content: text
    }));
    input.value = '';
  }

  function sendQuick(text) {
    if (!stompClient || !stompClient.connected) return showToast('Connect first', 'error');
    stompClient.send('/app/chat.send/' + currentRoom, {}, JSON.stringify({
      sender: currentUser,
      content: text
    }));
  }

  function sendJoin() {
    if (!stompClient || !stompClient.connected) return showToast('Connect first', 'error');
    sendJoinEvent(currentRoom);
  }

  function sendJoinEvent(room) {
    stompClient.send('/app/chat.join/' + room, {}, JSON.stringify({
      sender: currentUser,
      type: 'JOIN'
    }));
  }

  async function loadHistory() {
    const base = document.getElementById('server-url').value.replace('/ws-chat', '');
    try {
      const res = await fetch(base + '/api/chat/history/' + currentRoom);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const msgs = await res.json();
      clearMessages();
      msgs.forEach(m => {
        if (m.type === 'JOIN' || m.type === 'LEAVE') {
          addSystemMessage(m.content || m.sender + ' joined');
        } else {
          addMessage(m.sender, m.content, m.sender === currentUser, m.sentAt);
        }
      });
      showToast('Loaded ' + msgs.length + ' messages', 'success');
    } catch (e) {
      showToast('Failed to load history: ' + e.message, 'error');
    }
  }

  // ── DOM helpers ──
  function addMessage(sender, content, isSelf, time) {
    removeEmpty();
    const box = document.getElementById('messages');
    const ts = time ? new Date(time).toLocaleTimeString() : new Date().toLocaleTimeString();
    const el = document.createElement('div');
    el.className = 'msg ' + (isSelf ? 'sent' : 'recv');
    el.innerHTML = `
      <div class="msg-meta">${isSelf ? '' : sender + ' · '}${ts}</div>
      <div class="msg-bubble">${escHtml(content)}</div>
    `;
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
  }

  function addSystemMessage(text) {
    removeEmpty();
    const box = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'msg system';
    el.innerHTML = `<div class="msg-bubble">${escHtml(text)}</div>`;
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
  }

  function clearMessages() {
    const box = document.getElementById('messages');
    box.innerHTML = `
      <div class="empty-state" id="empty-state">
        <div class="big">💬</div>
        <div>Room cleared — send a message to start</div>
      </div>`;
  }

  function removeEmpty() {
    const e = document.getElementById('empty-state');
    if (e) e.remove();
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
